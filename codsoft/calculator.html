
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nova Calculator</title>

<style>
* {
    box-sizing: border-box;
}

:root {
    --page: #0b1020;
    --panel: #151c30;
    --key: #222b43;
    --text: #f5f7ff;
    --muted: #9ba7c0;
    --accent: #7885ff;
    --operator: #343052;
}

body.light {
    --page: #eef0fa;
    --panel: #ffffff;
    --key: #f0f2fa;
    --text: #20243a;
    --muted: #737b91;
    --accent: #555edb;
    --operator: #e8e8ff;
}

body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 20px;
    background:
        radial-gradient(circle at top, #222958, var(--page) 60%);
    font-family: Arial, sans-serif;
    color: var(--text);
    transition: background .2s;
}

body.light {
    background: var(--page);
}

.calculator {
    width: 100%;
    max-width: 370px;
    padding: 23px;
    background: var(--panel);
    border: 1px solid #8993b01e;
    border-radius: 25px;
    box-shadow: 0 25px 80px #0004;
}

.top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 20px;
}

.top h2 {
    font-size: 16px;
    letter-spacing: 2px;
    margin: 0;
}

.top button {
    width: 38px;
    height: 38px;
    border-radius: 50%;
    background: var(--key);
    color: var(--text);
    border: 0;
    font-size: 18px;
    cursor: pointer;
}

.screen {
    min-height: 125px;
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    justify-content: flex-end;
    overflow: hidden;
    padding: 10px 2px 22px;
}

.history {
    color: var(--muted);
    font-size: 14px;
    min-height: 24px;
    max-width: 100%;
    overflow-wrap: anywhere;
}

#display {
    width: 100%;
    border: none;
    outline: none;
    background: transparent;
    color: var(--text);
    text-align: right;
    font-size: clamp(30px, 8vw, 42px);
    font-weight: 600;
}

.keys {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 11px;
}

.keys button {
    min-width: 0;
    height: 59px;
    border: 0;
    border-radius: 14px;
    background: var(--key);
    color: var(--text);
    font-size: 18px;
    cursor: pointer;
    transition: transform .1s, filter .15s;
}

.keys button:hover {
    filter: brightness(1.18);
}

.keys button:active {
    transform: scale(.94);
}

.keys .operator {
    background: var(--operator);
    color: #bfc5ff;
}

.keys .utility {
    color: #ffad9e;
}

.keys .equals {
    background: var(--accent);
    color: white;
    font-size: 23px;
}

.note {
    margin: 18px 0 0;
    text-align: center;
    font-size: 12px;
    color: var(--muted);
}

@media(max-width:380px) {
    .calculator { padding: 15px; }
    .keys { gap: 7px; }
    .keys button { height: 53px; }
}
</style>
</head>

<body>
<div class="calculator">

    <div class="top">
        <h2>NOVA CALCULATOR</h2>
        <button id="theme" aria-label="Switch theme">☼</button>
    </div>

    <div class="screen">
        <div id="history" class="history"></div>
        <input id="display" value="0" readonly aria-label="Calculator display">
    </div>

    <div class="keys">
        <button class="utility" data-action="clear">AC</button>
        <button class="utility" data-action="delete">DEL</button>
        <button class="utility" data-action="percent">%</button>
        <button class="operator" data-value="/">÷</button>

        <button data-value="7">7</button>
        <button data-value="8">8</button>
        <button data-value="9">9</button>
        <button class="operator" data-value="*">×</button>

        <button data-value="4">4</button>
        <button data-value="5">5</button>
        <button data-value="6">6</button>
        <button class="operator" data-value="-">−</button>

        <button data-value="1">1</button>
        <button data-value="2">2</button>
        <button data-value="3">3</button>
        <button class="operator" data-value="+">+</button>

        <button data-action="sign">+/−</button>
        <button data-value="0">0</button>
        <button data-value=".">.</button>
        <button class="equals" data-action="equals">=</button>
    </div>

    <p class="note">Keyboard supported · Simple & fast</p>
</div>

<script>
const display = document.getElementById("display");
const history = document.getElementById("history");
const keys = document.querySelector(".keys");

let expression = "";
let justCalculated = false;

function render() {
    display.value = expression || "0";
}

function append(value) {
    if (justCalculated && /[0-9.]/.test(value)) {
        expression = "";
        history.textContent = "";
    }

    justCalculated = false;

    const last = expression.slice(-1);

    if ("+-*/".includes(value)) {
        if (!expression && value !== "-") return;

        if ("+-*/".includes(last)) {
            expression = expression.slice(0, -1);
        }
    }

    if (value === ".") {
        const current = expression.split(/[+\-*/]/).pop();

        if (current.includes(".")) return;
        if (!current) value = "0.";
    }

    expression += value;
    render();
}

function calculate() {
    if (!expression ||
        !/^[0-9+\-*/. ]+$/.test(expression)) {
        return;
    }

    try {
        const result = Function(
            '"use strict"; return (' + expression + ')'
        )();

        if (!Number.isFinite(result)) {
            display.value = "Error";
            expression = "";
            return;
        }

        history.textContent = expression + " =";
        expression = String(Number(result.toPrecision(12)));
        justCalculated = true;
        render();
    } catch {
        display.value = "Error";
        expression = "";
    }
}

function clearAll() {
    expression = "";
    justCalculated = false;
    history.textContent = "";
    render();
}

function deleteLast() {
    expression = expression.slice(0, -1);
    justCalculated = false;
    render();
}

function percentage() {
    if (!expression ||
        !Number.isFinite(Number(expression))) return;

    expression = String(Number(expression) / 100);
    justCalculated = false;
    render();
}

function toggleSign() {
    if (!expression) return;

    expression = expression.startsWith("-")
        ? expression.slice(1)
        : "-" + expression;

    justCalculated = false;
    render();
}

keys.addEventListener("click", function(event) {
    const button = event.target.closest("button");
    if (!button) return;

    if (button.dataset.value !== undefined) {
        append(button.dataset.value);
        return;
    }

    const action = button.dataset.action;

    if (action === "clear") clearAll();
    if (action === "delete") deleteLast();
    if (action === "equals") calculate();
    if (action === "percent") percentage();
    if (action === "sign") toggleSign();
});

document.addEventListener("keydown", function(event) {
    if (/^[0-9.]$/.test(event.key)) {
        append(event.key);
    } else if ("+-*/".includes(event.key)) {
        append(event.key);
    } else if (event.key === "Enter" || event.key === "=") {
        event.preventDefault();
        calculate();
    } else if (event.key === "Backspace") {
        deleteLast();
    } else if (event.key === "Escape") {
        clearAll();
    }
});

document.getElementById("theme").addEventListener("click", function() {
    document.body.classList.toggle("light");
});
</script>
</body>
</html>
